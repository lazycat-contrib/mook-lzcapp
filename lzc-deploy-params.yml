params:
  - id: admin_password
    type: secret
    name: "Admin password"
    description: "Password for the Mook web console; at least 8 characters, stored as a bcrypt hash"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    admin_password:
      name: "管理员密码"
      description: "Mook 网页控制台的登录密码，至少 8 位，以 bcrypt 哈希存储"