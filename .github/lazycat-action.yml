version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: mook

build:
  toolchains: []
  run_buildscript: false

images:
  # Upstream publishes immutable version tags per release (plus minor/major aliases,
  # `latest` and `sha-*` tags). Track the full three-part version family.
  - id: mook
    target: service
    service: mook
    source: docker.io/nikoyomi/mook
    channel: stable
    sort: semver
    tag_regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Mook
    summary: "支持 AI 的自托管 SSH 终端与服务器管理工具"